<!DOCTYPE html>
<!-- HTML: elementer, attributter, entiteter, CSS og JavaScript -->
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Høst &ndash; prøveside</title>
  <link rel="stylesheet" href="stil.css">
  <style>
    body { margin: 0 auto; color: #2d271d; }
    .kort:hover > h2 { font-weight: 700; }
  </style>
</head>
<body class="lys" data-tema="høst">
  <header id="topp">
    <h1>Fysikk &amp; matematikk</h1>
    <nav><a href="https://example.com" target="_blank">Lenke</a></nav>
  </header>
  <main>
    <p>Tekst med <strong>fet</strong>, <em>kursiv</em> og <code>kode</code>.</p>
    <img src="bilde.png" alt="Et bilde" width="320" hidden>
    <form action="/send" method="post">
      <label for="masse">Masse</label>
      <input type="number" id="masse" min="0" step="0.1" required>
      <button type="submit" disabled>Send</button>
    </form>
    <table><tr><th>m</th><td>2,5 kg</td></tr></table>
    <!-- Vanskelige tilfeller: attributter uten verdi, entiteter, innebygd CSS/JS, SVG og egne elementer -->
    <section id="vanskelig" class="a b c" data-json='{"x": 1, "y": [2, 3]}' aria-hidden="false" tabindex=-1>
      <p>a + b == c &lt;ikke tagg&gt; &quot;sitat&quot; &#8364; &euro; &nbsp;</p>
      <a href="javascript:void(0)" onclick="alert('x' + 1); return false;" style="color: #c4502b; margin: 0 1em">Klikk</a>
      <input type="checkbox" checked disabled name="valg[]" value="1">
      <input type="text" placeholder="Skriv &quot;her&quot;" pattern="[a-z]+">
      <select multiple size="3"><optgroup label="Gruppe"><option value="a" selected>A</option><option>B</option></optgroup></select>
      <textarea rows="2" cols="20">Tekst med <tagg> inni og &amp;</textarea>
      <svg width="40" height="40" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
        <circle cx="20" cy="20" r="15" fill="#c4502b"/><path d="M0,0 L40,40"/>
      </svg>
      <pre><code class="language-python">def f(x): return x + 1</code></pre>
      <template><slot name="x"></slot></template>
      <my-element some-attr="1" :bind="x" @click="handler" v-if="aktiv" x-data="{ open: false }"></my-element>
      <!-- <p>Utkommentert <b>tagg</b></p> -->
    </section>
  </main>
  <script type="module">
    const knapp = document.querySelector("button");
    knapp.addEventListener("click", () => alert(`Hei ${1 + 1}`));
  </script>
</body>
</html>
