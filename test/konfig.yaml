# YAML: nøkler, verdier, lister, ankre og flerlinjetekst
---
navn: hoest-prove
versjon: "1.2.0"
aktiv: true
slettet: no
tom: null
annen_tom: ~
masse: 2.5
heltall: 0x1F
dato: 2026-10-30
standard: &standard
  farge: rust
  størrelse: 14
tema:
  <<: *standard
  farge: oransje
liste:
  - første
  - 'andre med apostrof'
  - "tredje med escape\t"
  - { innebygd: objekt, tall: 3 }
  - [a, b, c]
beskrivelse: |
  Flere linjer
  med bevart linjeskift.
foldet: >-
  Linjer som foldes
  sammen til én.
egen_type: !!str 123
jobber:
  bygg:
    runs-on: ubuntu-latest
    steps:
      - run: npm ci && npm test
# Vanskelige tilfeller: flerdokument, sammensatte nøkler, tagger, ankre i lister og spesialverdier
---
? [sammensatt, nøkkel]
: verdi
"nøkkel med sitat": 'verdi med ''apostrof'''
nøkkel.med.punktum: a + b == c
tall: [0o17, 1_000, 6.674e-11, .inf, -.Inf, .NaN, 1e3]
tidspunkt: 2026-11-04T12:00:00+01:00
sann: [true, True, TRUE, yes, on, y]
tom_streng: ""
flerlinje_sitert: "første linje
  andre linje"
liste_av_lister:
  - - a
    - b
  - - c
objekt_i_liste:
  - navn: Jorda
    masse: 5.972e24
    måner: [Månen]
  - navn: &mars Mars
    beskrivelse: >+
      Bevart avsluttende linjeskift.

    alias: *mars
binær: !!binary R0lGODlhDAAMAIQAAP
egendefinert: !punkt { x: 1, y: 2 }
skript: |-
  if [[ $x -gt 1 ]]; then echo "a + b"; fi
...
